name: Deploy Landing + Web App to GitHub Pages

# 部署结构：
#   /guichu/          → public/index.html  （宣传落地页）
#   /guichu/app/      → Expo Web App 首页
#   /guichu/app/...   → 所有 App 路由（添加长辈、对话、族谱、设置 …）

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'public/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - '.npmrc'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # 1) 先准备 dist 根 = 宣传落地页
      - name: Stage landing page at dist/
        run: |
          mkdir -p dist
          cp -R public/. dist/

      # 2) 再把 Expo Web App 导出到 dist/app/（baseUrl=/guichu/app 由 app.json 决定）
      - name: Export Expo web to dist/app/
        run: npx expo export --platform web --output-dir dist/app

      # Pages 对 SPA 深链接没有天然 fallback：
      # App 里的动态路由（如 /app/ancestors/[id]/chat）刷新时，服务器找不到静态文件会落到 404.html
      # 把 App 首页复制为 404.html，让 expo-router 客户端接管。
      - name: SPA 404 fallback for /app/*
        run: cp dist/app/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
